<!DOCTYPE html>
<html lang="pt-br">
   <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Formularios Web</title>
   <meta name="description" content="descrição da pagina">
   <meta name="author" content="Laércio Santos">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/pequeno.css">
   <link rel="stylesheet" href="css/normalize.css">
   <link rel="stylesheet" href="css/medio.css">
   <link rel="stylesheet" href="css/grande.css">
   <script src="scripts/main.js" defer></script>
</head>
<body>
   <header><h1>Formularios Web</h1></header>
   <main>
    <form method="GET" action="avaliacao.html" class="fw1">
        <fieldset>
            <legend>informações do candidato</legend>
            <label for="">
                Nome:*<input type="text" name="nome" required>
            </label>
            <label for="">
                Sobrenome:*<input type="text" name="sobrenome" required>
            </label>
            <label for="">
                Telefone:*<input type="tel" name="fone" placeholder="123456789" required>
            </label>
            <label for="">
                Email:*<input type="email" name="email" placeholder="alguem@gmail.com" required>
            </label>
            <label for="">
                Websie:*<input type="url" name="url" placeholder="http://" required>
            </label>
        </fieldset>

        <fieldset>
            <legend>Informações do Curso</legend>
            <div>Público do Curso</div>
                <label>
                    <input type="radio" name="publico" value="iniciante">Iniciante
                </label>
                <label>
                    <input type="radio" name="publico" value="iniciante">Intermediario
                </label>
                <label>
                    <input type="radio" name="publico" value="iniciante">Avançado
                </label>

                <div>Software necessário</div>
                <label>
                    <input type="checkbox" name="edicao" value="sim">Edição de Foto
                </label>
                <label>
                    <input type="checkbox" name="programacao" value="sim">Programacao
                </label>
                <label>
                    <input type="checkbox" name="processador" value="sim">Pré-processador
                </label>
                <label>
                    <input type="checkbox" name="cliente" value="sim">Cliente FTP
                </label>
        </fieldset>
        <fieldset>
            <legend>Finaciamento</legend>
            <label>Data prevista de conclusão 
                <input type="date" name="data">
            </label>

            <label>
                Área do Curso
                <select name="tema">
                    <option value="">Selecione</option>
                    <option value="">Desenvolvimetno de Software</option>
                    <option value="">Profissional Criativo</option>
                    <option value="">Tecnologia da Informação</option>
                    <option value="">Analista de Dados</option>
                    <option value="">Construção</option>
                    <option value="">Manufatra</option>
                    <option value="">Negócios</option>
                    <option value="">Segurança cibernetica</option>
                </select>
                <label>Quantidade de autores
                    <input type="number" name="autores">
                </label>
            </label>
        </fieldset>
        <input type="submit" value="Propor meu curso">
    </form>
   </main>
   <footer>&copy;Laércio Santos | BYU-Pathway | WDD 131 2026</footer>
</body>
</html>
