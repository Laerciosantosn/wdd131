<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios Web</title>
    <meta name="description" content="Pagina de formulario para de avalição de produtos e satifação do usuario">
    <meta name="author" content="Laércio Santos">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>

<body>
    <header>
        <h1>Avaliação do Produto</h1>
    </header>
    <main>
        <form method="GET" action="avaliacao.html" class="fw1">

            <fieldset>
                Nome do produto
                <select id="produto" name="tema" required>
                    <option value="" disabled selected>Selecione um produto ...</option>   
                </select>
                Classificação Geral
                <div id="radio-container">
                    <label class="radio">&star;<input type="radio" name="estrela" value="1" id="star1" required></label>
                    <label class="radio">&star;&star;<input type="radio" name="estrela" value="2" id="star2" required></label>
                    <label class="radio">&star;&star;&star;<input type="radio" name="estrela" value="3" id="star3" required></label>
                    <label class="radio">&star;&star;&star;&star;<input type="radio" name="estrela" value="4" id="star4" required></label>
                    <label class="radio">&star;&star;&star;&star;&star;<input type="radio" name="estrela" value="5" id="star5" required></label>
                </div>
            </fieldset>
            <label>Data de Instalação
                <input type="date" name="data-instalacao" id="data-instalacao" required value="">
            </label>
            <div>Quais recursos você achou úteis no produto?<br>(Marque todos que se aplicam)</div>
            <label class="edicao"><input type="checkbox" id="edicaoFoto" name="edicao" value="sim">Edição de Foto</label>
            <label><input type="checkbox" id="progamacao" name="programacao" value="sim">Programacao</label>
            <label><input type="checkbox" id="processador" name="processador" value="sim">Pré-processador</label>
            <label><input type="checkbox" id="clienteFtp" name="cliente" value="sim">Cliente FTP</label>

            <label for="mensagem">
                Avaliação Escrita<span>(Opcional)</span>
                <textarea name="mensagem" id="mensagem" rows="6" cols="40">
                </textarea>
            </label>

            <label for="nome">
                Seu Nome <span>(Opcional)</span>
                <input type="text" name="nome" id="nome">
            </label>
            <input type="submit" value="Publicar Avaliação">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="anoAtual"></span>Laércio Santos | BYU-Pathway | <span class="folha-dir">🌿</span> São Paulo
            - Brasil</p>
        <p>Última modificação: <img src="imagens/calendar.svg" alt="Iconde de um calendario"><span
                id="ultimaModificacao"></span></p>

    </footer>
</body>

</html>
